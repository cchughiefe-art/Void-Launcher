name: Build Signed Void Launcher v2 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Void Launcher
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore Void signing key
        env:
          VOID_KEYSTORE_B64: ${{ secrets.VOID_KEYSTORE_B64 }}
          VOID_KEYSTORE_PASSWORD: ${{ secrets.VOID_KEYSTORE_PASSWORD }}
          VOID_KEY_ALIAS: ${{ secrets.VOID_KEY_ALIAS }}
          VOID_KEY_PASSWORD: ${{ secrets.VOID_KEY_PASSWORD }}
        run: |
          test -n "$VOID_KEYSTORE_B64"
          test -n "$VOID_KEYSTORE_PASSWORD"
          test -n "$VOID_KEY_ALIAS"
          test -n "$VOID_KEY_PASSWORD"
          printf '%s' "$VOID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/void-launcher-release.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/void-launcher-release.jks"
            printf 'storePassword=%s\n' "$VOID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$VOID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$VOID_KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleLawnWithQuickstepGithubRelease

      - name: Verify APK signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose build/outputs/apk/lawnWithQuickstepGithub/release/*.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: Void-Launcher-v2-signed
          path: build/outputs/apk/lawnWithQuickstepGithub/release/*.apk
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/void-launcher-release.jks"
