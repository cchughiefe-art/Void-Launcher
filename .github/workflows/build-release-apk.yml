name: Build Signed Void Launcher Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore private signing key
        env:
          VOID_KEYSTORE_B64: ${{ secrets.VOID_KEYSTORE_B64 }}
        run: |
          test -n "$VOID_KEYSTORE_B64"
          printf '%s' "$VOID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/void-launcher-release.jks"

      - name: Build signed release APK
        env:
          VOID_KEYSTORE_PATH: ${{ runner.temp }}/void-launcher-release.jks
          VOID_KEYSTORE_PASSWORD: ${{ secrets.VOID_KEYSTORE_PASSWORD }}
          VOID_KEY_ALIAS: ${{ secrets.VOID_KEY_ALIAS }}
          VOID_KEY_PASSWORD: ${{ secrets.VOID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk Void-Launcher-v1.2-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Void-Launcher-v1.2-signed-release
          path: Void-Launcher-v1.2-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/void-launcher-release.jks"
