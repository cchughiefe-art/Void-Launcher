name: Apply Void Private Space phase 1
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Add Private Space and gesture tuning
        run: |
          python3 - <<'PY'
          from pathlib import Path

          launcher = Path('src/com/android/launcher3/Launcher.java')
          text = launcher.read_text()
          field_anchor = '    private boolean mTouchInProgress;'
          fields = '''    private boolean mTouchInProgress;

    // Void Private Space: an inward swipe from either screen edge opens the secure space.
    private float mVoidGestureDownX;
    private float mVoidGestureDownY;
    private boolean mVoidEdgeGestureActive;
    private boolean mVoidPrivateSpaceOpening;
'''
          if 'mVoidGestureDownX' not in text:
              if field_anchor not in text:
                  raise SystemExit('Launcher field anchor not found')
              text = text.replace(field_anchor, fields, 1)

          old_touch = '''    @Override
    public boolean dispatchTouchEvent(MotionEvent ev) {
        switch (ev.getAction()) {
            case MotionEvent.ACTION_DOWN:
                mTouchInProgress = true;
                break;
            case MotionEvent.ACTION_UP:
                mLastTouchUpTime = SystemClock.uptimeMillis();
                // Follow through
            case MotionEvent.ACTION_CANCEL:
                mTouchInProgress = false;
                break;
        }
        TestLogging.recordMotionEvent(TestProtocol.SEQUENCE_MAIN, "Touch event", ev);
        return super.dispatchTouchEvent(ev);
    }
'''
          new_touch = '''    @Override
    public boolean dispatchTouchEvent(MotionEvent ev) {
        final float density = getResources().getDisplayMetrics().density;
        switch (ev.getActionMasked()) {
            case MotionEvent.ACTION_DOWN:
                mTouchInProgress = true;
                mVoidPrivateSpaceOpening = false;
                mVoidGestureDownX = ev.getX();
                mVoidGestureDownY = ev.getY();
                float edge = 32f * density;
                mVoidEdgeGestureActive = isInState(NORMAL)
                        && (mVoidGestureDownX <= edge
                        || mVoidGestureDownX >= getRootView().getWidth() - edge);
                break;
            case MotionEvent.ACTION_MOVE:
                if (mVoidEdgeGestureActive && !mVoidPrivateSpaceOpening) {
                    float dx = ev.getX() - mVoidGestureDownX;
                    float dy = ev.getY() - mVoidGestureDownY;
                    boolean fromLeft = mVoidGestureDownX <= 32f * density && dx > 0;
                    boolean fromRight = mVoidGestureDownX >= getRootView().getWidth()
                            - 32f * density && dx < 0;
                    if ((fromLeft || fromRight)
                            && Math.abs(dx) >= 52f * density
                            && Math.abs(dx) > Math.abs(dy) * 1.15f) {
                        mVoidPrivateSpaceOpening = true;
                        mVoidEdgeGestureActive = false;
                        startActivity(new Intent(this, VoidPrivateSpaceActivity.class));
                        overridePendingTransition(android.R.anim.fade_in, android.R.anim.fade_out);
                        return true;
                    }
                }
                break;
            case MotionEvent.ACTION_UP:
                mLastTouchUpTime = SystemClock.uptimeMillis();
                // Follow through
            case MotionEvent.ACTION_CANCEL:
                mTouchInProgress = false;
                mVoidEdgeGestureActive = false;
                break;
        }
        TestLogging.recordMotionEvent(TestProtocol.SEQUENCE_MAIN, "Touch event", ev);
        return super.dispatchTouchEvent(ev);
    }
'''
          if 'VoidPrivateSpaceActivity.class' not in text:
              if old_touch not in text:
                  raise SystemExit('Launcher touch method anchor not found')
              text = text.replace(old_touch, new_touch, 1)
          launcher.write_text(text)

          controller = Path('src/com/android/launcher3/touch/AbstractStateChangeTouchController.java')
          text = controller.read_text()
          old = 'successTransitionProgress = AllAppsSwipeController.ALL_APPS_STATE_TRANSITION_MANUAL;'
          new = 'successTransitionProgress = Math.min(0.22f, AllAppsSwipeController.ALL_APPS_STATE_TRANSITION_MANUAL);'
          if new not in text:
              if old not in text:
                  raise SystemExit('Drawer threshold anchor not found')
              text = text.replace(old, new, 1)
          controller.write_text(text)

          manifest = Path('AndroidManifest.xml')
          text = manifest.read_text()
          activity = '''
        <activity
            android:name="com.android.launcher3.VoidPrivateSpaceActivity"
            android:exported="false"
            android:excludeFromRecents="true"
            android:launchMode="singleTask"
            android:screenOrientation="unspecified" />
'''
          if 'VoidPrivateSpaceActivity' not in text:
              if '</application>' not in text:
                  raise SystemExit('Manifest application anchor not found')
              text = text.replace('</application>', activity + '    </application>', 1)
          manifest.write_text(text)
          PY

          cat > src/com/android/launcher3/VoidPrivateSpaceActivity.java <<'JAVA'
          package com.android.launcher3;

          import android.app.Activity;
          import android.app.KeyguardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.hardware.biometrics.BiometricPrompt;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.CancellationSignal;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ListView;
          import android.widget.Switch;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;

          /** Secure, launcher-owned surface opened by an inward swipe from either edge. */
          public class VoidPrivateSpaceActivity extends Activity {
              private static final int REQUEST_DEVICE_CREDENTIAL = 8421;
              private static final String PREFS = "void_private_space";
              private static final String KEY_BIOMETRIC = "biometric_lock";
              private static final String KEY_AUTO_LOCK = "auto_lock";
              private static final int BG = Color.rgb(10, 10, 14);
              private static final int PANEL = Color.rgb(28, 27, 34);
              private static final int ACCENT = Color.rgb(139, 92, 246);

              private final CancellationSignal cancellationSignal = new CancellationSignal();
              private SharedPreferences prefs;
              private boolean unlocked;
              private boolean authenticating;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  Window window = getWindow();
                  window.setStatusBarColor(BG);
                  window.setNavigationBarColor(BG);
                  prefs = getSharedPreferences(PREFS, MODE_PRIVATE);
                  showLockedScreen();
              }

              @Override
              protected void onStart() {
                  super.onStart();
                  if (!unlocked && !authenticating) authenticate();
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  if (!isChangingConfigurations() && prefs.getBoolean(KEY_AUTO_LOCK, true)) {
                      unlocked = false;
                      authenticating = false;
                  }
              }

              private void showLockedScreen() {
                  LinearLayout root = baseLayout();
                  root.setGravity(Gravity.CENTER);
                  TextView mark = title("VOID", 42);
                  mark.setTextColor(ACCENT);
                  root.addView(mark);
                  TextView label = title("Private Space", 26);
                  root.addView(label);
                  TextView hint = body("Swipe inward from either edge to enter. Your phone lock protects this separate launcher surface.");
                  hint.setGravity(Gravity.CENTER);
                  root.addView(hint, margins(-1, -2, 32));
                  Button unlock = button("Unlock Private Space");
                  unlock.setOnClickListener(v -> authenticate());
                  root.addView(unlock, margins(-1, dp(54), 24));
                  setContentView(root);
              }

              private void authenticate() {
                  if (!prefs.getBoolean(KEY_BIOMETRIC, true)) {
                      showUnlocked();
                      return;
                  }
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.P) {
                      requestDeviceCredential();
                      return;
                  }
                  authenticating = true;
                  BiometricPrompt prompt = new BiometricPrompt.Builder(this)
                          .setTitle("Unlock Void Private Space")
                          .setSubtitle("Use your fingerprint or phone screen lock")
                          .setNegativeButton("Use screen lock", getMainExecutor(),
                                  (dialog, which) -> requestDeviceCredential())
                          .build();
                  prompt.authenticate(cancellationSignal, getMainExecutor(),
                          new BiometricPrompt.AuthenticationCallback() {
                              @Override
                              public void onAuthenticationSucceeded(
                                      BiometricPrompt.AuthenticationResult result) {
                                  authenticating = false;
                                  showUnlocked();
                              }

                              @Override
                              public void onAuthenticationError(int code, CharSequence message) {
                                  authenticating = false;
                                  if (code != BiometricPrompt.BIOMETRIC_ERROR_CANCELED
                                          && code != BiometricPrompt.BIOMETRIC_ERROR_USER_CANCELED
                                          && code != BiometricPrompt.BIOMETRIC_ERROR_NEGATIVE_BUTTON) {
                                      requestDeviceCredential();
                                  }
                              }
                          });
              }

              private void requestDeviceCredential() {
                  authenticating = false;
                  KeyguardManager km = (KeyguardManager) getSystemService(KEYGUARD_SERVICE);
                  if (km != null && km.isDeviceSecure()) {
                      Intent intent = km.createConfirmDeviceCredentialIntent(
                              "Unlock Void Private Space", "Confirm your phone screen lock");
                      if (intent != null) startActivityForResult(intent, REQUEST_DEVICE_CREDENTIAL);
                  } else {
                      Toast.makeText(this, "Set a phone screen lock to protect Private Space", Toast.LENGTH_LONG).show();
                      startActivity(new Intent(Settings.ACTION_SECURITY_SETTINGS));
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQUEST_DEVICE_CREDENTIAL && resultCode == RESULT_OK) {
                      showUnlocked();
                  }
              }

              private void showUnlocked() {
                  unlocked = true;
                  authenticating = false;
                  LinearLayout root = baseLayout();
                  LinearLayout header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.VERTICAL);
                  header.setPadding(dp(22), dp(18), dp(22), dp(12));
                  TextView heading = title("Private Space", 30);
                  header.addView(heading);
                  TextView subtitle = body("Separate launcher surface · protected by your phone lock");
                  header.addView(subtitle);
                  root.addView(header);

                  Switch biometric = toggle("Fingerprint / screen-lock gate",
                          prefs.getBoolean(KEY_BIOMETRIC, true));
                  biometric.setOnCheckedChangeListener((v, checked) ->
                          prefs.edit().putBoolean(KEY_BIOMETRIC, checked).apply());
                  root.addView(biometric);

                  Switch autoLock = toggle("Lock whenever you leave",
                          prefs.getBoolean(KEY_AUTO_LOCK, true));
                  autoLock.setOnCheckedChangeListener((v, checked) ->
                          prefs.edit().putBoolean(KEY_AUTO_LOCK, checked).apply());
                  root.addView(autoLock);

                  TextView appsHeading = body("PRIVATE APP DRAWER");
                  appsHeading.setTextColor(ACCENT);
                  appsHeading.setPadding(dp(22), dp(22), dp(22), dp(8));
                  root.addView(appsHeading);

                  List<ResolveInfo> apps = loadLaunchableApps();
                  List<String> labels = new ArrayList<>();
                  PackageManager pm = getPackageManager();
                  for (ResolveInfo info : apps) labels.add(info.loadLabel(pm).toString());
                  ListView list = new ListView(this);
                  list.setDividerHeight(0);
                  list.setAdapter(new ArrayAdapter<String>(this, android.R.layout.simple_list_item_1, labels) {
                      @Override
                      public View getView(int position, View convertView, ViewGroup parent) {
                          LinearLayout row = new LinearLayout(VoidPrivateSpaceActivity.this);
                          row.setGravity(Gravity.CENTER_VERTICAL);
                          row.setPadding(dp(22), dp(10), dp(22), dp(10));
                          ImageView icon = new ImageView(VoidPrivateSpaceActivity.this);
                          icon.setImageDrawable(apps.get(position).loadIcon(pm));
                          row.addView(icon, new LinearLayout.LayoutParams(dp(44), dp(44)));
                          TextView text = title(getItem(position), 17);
                          text.setPadding(dp(18), 0, 0, 0);
                          row.addView(text, new LinearLayout.LayoutParams(0, dp(58), 1));
                          return row;
                      }
                  });
                  list.setOnItemClickListener((parent, view, position, id) -> {
                      ResolveInfo info = apps.get(position);
                      Intent launch = pm.getLaunchIntentForPackage(info.activityInfo.packageName);
                      if (launch != null) startActivity(launch);
                  });
                  root.addView(list, new LinearLayout.LayoutParams(-1, 0, 1));
                  setContentView(root);
              }

              private List<ResolveInfo> loadLaunchableApps() {
                  Intent query = new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER);
                  List<ResolveInfo> apps = new ArrayList<>(getPackageManager().queryIntentActivities(query, 0));
                  apps.removeIf(info -> getPackageName().equals(info.activityInfo.packageName));
                  Collections.sort(apps, new ResolveInfo.DisplayNameComparator(getPackageManager()));
                  return apps;
              }

              private LinearLayout baseLayout() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(BG);
                  root.setPadding(dp(16), dp(16), dp(16), dp(16));
                  return root;
              }

              private TextView title(String value, int sp) {
                  TextView view = new TextView(this);
                  view.setText(value);
                  view.setTextColor(Color.WHITE);
                  view.setTextSize(sp);
                  view.setGravity(Gravity.CENTER_VERTICAL);
                  return view;
              }

              private TextView body(String value) {
                  TextView view = title(value, 15);
                  view.setTextColor(Color.rgb(190, 186, 201));
                  view.setPadding(0, dp(8), 0, dp(8));
                  return view;
              }

              private Switch toggle(String value, boolean checked) {
                  Switch view = new Switch(this);
                  view.setText(value);
                  view.setTextColor(Color.WHITE);
                  view.setTextSize(16);
                  view.setChecked(checked);
                  view.setPadding(dp(22), dp(12), dp(12), dp(12));
                  return view;
              }

              private Button button(String value) {
                  Button view = new Button(this);
                  view.setText(value);
                  view.setTextColor(Color.WHITE);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(ACCENT);
                  bg.setCornerRadius(dp(28));
                  view.setBackground(bg);
                  return view;
              }

              private LinearLayout.LayoutParams margins(int width, int height, int top) {
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(width, height);
                  params.setMargins(dp(16), dp(top), dp(16), 0);
                  return params;
              }

              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }
          }
          JAVA

          git config user.name 'Void Launcher Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add AndroidManifest.xml src/com/android/launcher3/Launcher.java src/com/android/launcher3/touch/AbstractStateChangeTouchController.java src/com/android/launcher3/VoidPrivateSpaceActivity.java
          git commit -m 'Add secure edge-swipe Private Space'
          git push origin HEAD:main
