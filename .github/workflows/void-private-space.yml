name: Apply Void Private Space phase 1
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Add Private Space and gesture tuning
        env:
          PATCH_B64: 
          JAVA_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/void_patch.py
          python3 /tmp/void_patch.py
          printf '%s' "$JAVA_B64" | base64 --decode > src/com/android/launcher3/VoidPrivateSpaceActivity.java
          git config user.name 'Void Launcher Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add AndroidManifest.xml src/com/android/launcher3/Launcher.java src/com/android/launcher3/touch/AbstractStateChangeTouchController.java src/com/android/launcher3/VoidPrivateSpaceActivity.java
          git commit -m 'Add secure edge-swipe Private Space'
          git push origin HEAD:main
