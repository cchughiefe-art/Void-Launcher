name: Map Void feature integration points
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Map launcher code
        run: |
          set -euo pipefail
          {
            echo '# Void feature integration map'
            echo '## Drawer and gestures'
            grep -RInE 'AllAppsTransitionController|PortraitStatesTouchController|SwipeDetector|ALL_APPS' src quickstep lawnchair/src --include='*.java' --include='*.kt' | head -n 180 || true
            echo '## Lifecycle and touch'
            grep -RInE 'dispatchTouchEvent|onTouchEvent|onResume|onPause|onStop' src quickstep lawnchair/src --include='*Launcher*.java' --include='*Launcher*.kt' | head -n 120 || true
            echo '## Settings'
            grep -RInE 'PreferenceScreen|SwitchPreference|PreferenceManager' lawnchair/src --include='*.kt' --include='*.xml' | head -n 120 || true
            echo '## Security'
            grep -RInE 'BiometricPrompt|FLAG_SECURE|androidx.biometric' . --include='*.kt' --include='*.java' --include='*.gradle' --include='*.xml' --exclude-dir=build | head -n 80 || true
          } > VOID_CODEMAP.md
          git config user.name 'Void Launcher Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add VOID_CODEMAP.md
          git commit -m 'Refresh Void feature integration map'
          git push origin HEAD:main
