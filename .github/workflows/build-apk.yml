name: Build Void Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Void-Launcher-v0.6-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Void-Launcher-v0.6-test
          path: Void-Launcher-v0.6-test.apk
          if-no-files-found: error
          retention-days: 30
