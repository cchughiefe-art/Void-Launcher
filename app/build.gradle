plugins { id 'com.android.application' }

android {
    namespace 'com.voidlauncher.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.voidlauncher.app'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '1.2.1'
    }

    def releaseStorePath = System.getenv('VOID_KEYSTORE_PATH')
    def releaseStorePassword = System.getenv('VOID_KEYSTORE_PASSWORD')
    def releaseKeyAlias = System.getenv('VOID_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('VOID_KEY_PASSWORD')

    signingConfigs {
        release {
            if (releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity:1.10.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
}
